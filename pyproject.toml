[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-content-platform"
version = "0.1.0"
description = "Agentic brochure/blog content generation platform"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: runs real ffmpeg, Chromium or a full render (deselect with -m \"not slow\")",
]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::DeprecationWarning:pydantic.*",
]
