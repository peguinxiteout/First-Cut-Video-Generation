# State real-estate regulators. A URL is listed ONLY where it is the
# regulator's long-standing official address; otherwise the post names
# the regulator and links nothing (an invented URL is worse than none).
rera_portals:
  Gujarat: {name: "GujRERA", url: "https://gujrera.gujarat.gov.in"}
  Maharashtra: {name: "MahaRERA", url: "https://maharera.maharashtra.gov.in"}
  Karnataka: {name: "Karnataka RERA", url: "https://rera.karnataka.gov.in"}
  Uttar Pradesh: {name: "UP RERA", url: "https://www.up-rera.in"}
  Haryana: {name: "Haryana RERA (HRERA)", url: "https://haryanarera.gov.in"}

# Fact categories, checked in this order (first match wins), so "Metro
# Phase 2 under construction" is infrastructure, not connectivity.
fact_categories:
  legal: ['\brera\b', 'registration', 'registered', 'occupancy certificate', '\boc\b',
          'commencement certificate', 'encumbrance', 'title deed', 'stamp duty', 'approved plan',
          'approval', '\bkhata\b', 'mutation', '\blaw\b', '\bact\b', 'regulat']
  # Infrastructure means CHANGE: announced, approved or being built. An
  # expressway that already exists is connectivity.
  infrastructure: ['under construction', 'proposed', 'upcoming', 'planned', '\bphase\b',
                   'extension', 'sanctioned', 'expected to', 'will (?:open|connect|link)',
                   'being built', 'announced', 'tender']
  price: ['₹', '\brs\.?\s?\d', '\binr\b', '\blakh', '\bcrore', '\bprice', '\bpriced', '\bcost',
          'per sq', 'psf', '\bemi\b', 'listed at', 'starting at', 'budget']
  market: ['rental', '\brent\b', 'yield', 'appreciat', 'demand', 'supply', 'absorption',
           'inventory', '\d\s?%', 'per cent', 'percent', 'growth', 'sales']
  project: ['\bbhk\b', 'carpet area', 'built-up', '\btowers?\b', '\bacres?\b', '\bunits\b',
            'possession', '\bfloors\b', 'storey', 'launch', 'developer', 'amenit', 'clubhouse']
  employment: ['tech park', '\bit park', '\bsez\b', 'business district', 'office', 'employ', '\bjobs\b',
               'tech corridor', 'industrial', 'headquarter']
  social: ['school', 'college', 'universit', 'hospital', 'clinic', 'healthcare']
  amenity: ['\bmall', '\bpark\b', '\blake\b', 'garden', '\bclub\b', '\bgym\b', '\bpool\b',
            'market', 'supermarket', 'restaurant', 'temple', 'shopping']
  connectivity: ['\bkm\b', '\bmin(?:ute)?s?\b', 'metro', 'airport', 'railway', 'station',
                 'highway', 'ring road', '\broad\b', '\bbus\b', 'drive', 'commute', 'connect']
