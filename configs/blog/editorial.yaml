# Editorial lexicon for the blog pipeline.
#
# Every list here is DATA the normaliser, validator, composer and rubric
# read. Nothing in this file is about one particular article: it encodes
# the recurring failure modes found when generated posts were compared
# with strong human/ChatGPT posts (generic copy, stock AI phrasing,
# placeholder links, sales language, irrelevant geography), so fixing a
# new pattern is an edit here rather than a code change.

# Stock phrasing. value = replacement; null = drop the whole sentence
# (the phrase carries no meaning worth rescuing).
stock_phrases:
  "in today's fast-paced world, ": ""
  "in today's fast-paced world": ""
  "in conclusion, ": ""
  "in conclusion": ""
  "look no further": null
  "elevate your lifestyle": null
  "nestled amidst": "set among"
  "nestled among": "set among"
  "nestled in": "set in"
  "nestled": "located"
  "boasts": "has"
  "seamlessly": ""
  "a testament to": "evidence of"
  "let's dive into": "let's look at"
  "dive into": "look at"
  "delve into": "look at"
  "game-changer": "significant change"
  "game changer": "significant change"
  "a haven for": "well suited to"
  "a haven": "a good fit"
  "the perfect blend": "a balance"
  "unlock the potential": "make the most"
  "when it comes to": "for"
  "it is worth noting that ": ""
  "it's worth noting that ": ""

# Sales language. Counted by the rubric (marketing effectiveness), never
# silently rewritten: a writer told "too promotional" with the phrases
# named fixes it better than a find-and-replace would.
promotional_terms:
  - world-class
  - best-in-class
  - unmatched
  - unparalleled
  - luxurious lifestyle
  - dream home
  - once-in-a-lifetime
  - hurry
  - limited period
  - don't miss
  - exclusive offer
  - iconic
  - state-of-the-art
  - ultra-modern
  - golden opportunity
  - skyrocket
  - sky-rocket
  - must-buy
  - best investment
  - book now

# Claims that are a compliance problem, not just a tone problem: promising
# returns is exactly what a property advertisement may not do.
prohibited_claims:
  - guaranteed returns
  - assured returns
  - guaranteed appreciation
  - zero risk
  - risk-free investment
  - prices will double

# Placeholder detection. Regexes, case-insensitive.
placeholder_patterns:
  - '\bexample\.(?:com|org|net|in)\b'
  - '\byour[-_ ]?(?:website|domain|site|company|brand)\b(?:\.\w+)?'
  - '\b(?:website|domain|yoursite|mysite)\.com\b'
  - 'https?://\.\.\.'
  - 'https?://(?:www\.)?xxx'
  - '\[(?:link|url|website|insert[^\]]*|your[^\]]*|name|phone|email|company|address|contact[^\]]*)\]'
  - '\((?:link|url)\)'
  - '\{\{[^}]*\}\}'
  - '<\s*(?:insert|link|url|phone|email)[^>]*>'
  - '\blorem ipsum\b'
  - '\bX{3,}\b'
  - '\bx{4,}\b'
  - '\b\d{2}X{4,}\b'
  - '\+?\d{0,3}[- ]?X{3,}[- X]*'
  - '\b(?:123[- ]?456[- ]?7890|000[- ]?000[- ]?0000)\b'
  - '\b(?:info|sales|contact|hello)@(?:example|yourcompany|company|domain)\.\w+'
  - '\bplaceholder\b'

# Headings that say nothing. A heading equal to one of these (or to a
# bare catalogue label) is reported as generic.
generic_headings:
  - introduction
  - overview
  - conclusion
  - summary
  - location analysis
  - amenities
  - strengths
  - weaknesses
  - pros and cons
  - pros & cons
  - investment perspective
  - market perspective
  - lifestyle perspective
  - pricing & value
  - future potential
  - buyer considerations
  - final thoughts
  - key takeaways
  - in closing
  - background

# Domains treated as authoritative primary sources when research finds
# them (substring match on the host).
authority_domains:
  - .gov.in
  - .nic.in
  - .gov
  - rera
  - metrorail
  - metro-rail
  - municipal
  - mcgm
  - bbmp
  - amc.gov
  - rbi.org.in
  - nhb.org.in
  - who.int
  - censusindia

# Property listing portals and brokers. Not cited as sources: they are
# competitors' marketing, and citing them sends readers away.
competitor_domains:
  - 99acres
  - magicbricks
  - housing.com
  - nobroker
  - squareyards
  - commonfloor
  - makaan
  - proptiger
  - nestaway
  - quikr

# India-specific signals: if any appear in the brief, the post is written
# for an Indian reader (RERA, lakh/crore, carpet area).
india_markers: ["india", "₹", "inr", "rs.", "lakh", "crore", "rera", "bhk", "gujarat",
                "maharashtra", "karnataka", "uttar pradesh", "haryana", "telangana",
                "tamil nadu", "kerala"]

