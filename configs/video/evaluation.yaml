# The quality gate (node 10, agents/video/gate.py): measurements on the finished file and on the
# plan it was made from. No model judges anything here.
#
# Each check says pass, warn or fail. A pass scores 1, a warn 0.5, a fail 0, weighted by `weights`
# (a check that could not be measured is left out and the rest are re-weighted); the score is that
# share out of 100. The gate FAILS when a hard check fails or the score is under fail_below; it WARNS
# when any check warns or the score is under pass_at; otherwise it PASSES. The record's status is
# then "passed", "warned" or "failed", and a FAIL still keeps the MP4.
weights:
  format: 0.06
  duration: 0.07
  loudness: 0.06
  black_frames: 0.06
  frozen: 0.04
  narration_gaps: 0.05
  safe_zones: 0.06
  numbers: 0.12
  thumbnail: 0.04
  upscale: 0.06
  one_voice: 0.06
  hook: 0.06
  chips: 0.07
  narration_picture: 0.08
  narration_evidence: 0.03
  hold_length: 0.04
  repeated_photo: 0.04

pass_at: 85
fail_below: 70

# A hard check that fails fails the whole gate. The others only lower the score and warn.
hard: [format, duration, black_frames, safe_zones, numbers, thumbnail, one_voice, hook, chips, narration_picture]

format:
  vcodec: h264
  acodec: aac
  pix_fmt: yuv420p
  fps_tolerance: 0.1
  min_size_bytes: 50000

duration:
  warn_s: 0.25              # off the length asked for by more than this: warn
  fail_s: 0.5               # ... by more than this: fail

loudness:
  target_lufs: -16
  pass_lu: 1.0              # within this of the target: pass
  fail_lu: 3.0              # farther than this: fail; between: warn
  max_true_peak_dbfs: -1.0  # above this: warn; at or above 0: fail

# Frames of one colour that are nearly black, for this long or more. Dark photographs and the dark
# end card are not black: the pixel threshold is the share of the brightness range below which a
# pixel counts as black, and a frame counts when 98% of its pixels do.
black:
  min_s: 0.15
  pixel_threshold: 0.08
  warn_s: 0.0               # any black at all: warn
  fail_s: 0.3               # more than this in total: fail

# A picture that does not change for this long. The closing card is still by design and is left out.
frozen:
  noise_db: -60
  min_s: 1.0
  warn_s: 1.0
  fail_s: 2.0

# Silence between spoken lines, from the measured length of each line.
narration:
  max_gap_s: 1.2            # a pause between two lines longer than this: warn
  fail_gap_s: 2.5           # ... longer than this: fail
  max_lead_s: 1.2           # silence before the first word

safe_zones:
  tolerance_px: 6           # a piece of text may stray this far over the edge (anti-aliasing)

thumbnail:
  warn_stddev: 14           # brightness spread (0-255) under which a picture reads as almost blank
  fail_stddev: 6
  min_size_bytes: 4000

# Narration against picture: every amenity a spoken line names (the vocabulary of vision.yaml) must be
# a tag of one of the photographs that line plays over. This many amenities named and not shown: fail.
narration_picture:
  fail_missing: 1

# Evidence: each amenity a line names, and each chip, is over a photograph whose tags AND caption both say it
# (photo_tags.evidence). The planner only picks such photographs, so this warns for a plan made another way. Soft.
narration_evidence: {}

# How long a still is held (thresholds: `hold` in pacing.yaml). Soft: it lowers the score only.
hold_length: {}

# The same photograph in two shots one after the other: this many repeats or more warns.
repeated_photo:
  warn_at: 1

upscale:
  warn_above: 1.3           # the most a photograph's pixels may be enlarged, at the worst moment of a shot
  fail_above: 2.0

# Image-to-video truth (agents/video/motion_check.py). Not a gate check yet: scripts/test_ai_motion.py
# reports it. PROVISIONAL: set on synthetic cases and the Citrine photographs, not on model clips.
motion_truth:
  work_long_px: 192          # frames are compared at this long side (SSIM at twice it)
  sample_every_s: 0.5
  first_frame:               # the clip's first frame against the keyframe it was given
    ssim_pass: 0.80
    ssim_fail: 0.65
    phash_pass: 8            # bits of 64
    phash_fail: 16
  drift:                     # later frames against the matched window of the reference, edge correlation by block
    # Synthetic 3 s push-ins on three Citrine crops through H.264 (7 Nov 2026), worst sampled frame:
    # clean mean 0.95-0.98, p10 0.85-0.96; a sign added p10 0.47-0.54; the court and living room reshaped
    # mean 0.68-0.73, p10 0.32-0.33; another photograph mean under 0.2. Not caught: a person 16% of the
    # frame high, the tower facade stretched 12% (its repeated windows still line up).
    # A model's real camera has parallax a flat zoom does not, so expect to loosen these on model clips.
    mean_pass: 0.80
    mean_fail: 0.55
    p10_pass: 0.60
    p10_fail: 0.25
    below_at: 0.5            # a block under this correlation counts as "below"
    below_pass: 0.15         # share of blocks below
    below_fail: 0.35
  search:                    # the window search: zoom 1.0 = the reference's largest window of the frame's shape
    min_zoom: 0.85
    max_zoom: 1.6
    zoom_step: 0.05
    pos_step: 0.03           # share of the reference
    starts: 3                # coarse matches refined (more than one: repeated windows give false matches)
    seed_reach: 0.12         # and a finer search this far round the previous frame's match
    seed_step: 0.02
    align_blur: 1.5          # edges are blurred this much (px) for matching only, not for the scores
  blocks:
    rows: 8
    cols: 6
    min_valid: 0.9           # share of a block that must be the photograph's own pixels to be scored
    min_edge: 0.15           # a block with less than this share of the mean edge strength is not scored
  score:                     # the truth score (0-100) used to choose between clips of one shot
    first_frame: 0.3
    drift: 0.7
