# What a video may show that is not the person's own photograph, by sector.
#
# Real estate: a generated frame may set a mood (a way of living, an amenity
# the project lists but has no photograph of, the neighbourhood), never the
# building, the flats or their views. Passing off a render as the real thing
# misleads buyers; the brochure carries the same rule (ALLOWED_GENERATED_KINDS
# in src/data/schemas.py).
default_sector: real_estate

sectors:
  real_estate:
    allowed_generated_kinds: [lifestyle, amenity_concept, neighbourhood]

# Where text may go, as a share of the frame measured in from each edge. The
# bottom and top bands are where a platform draws its own controls (the
# caption, the profile, the progress bar), so nothing of ours goes there.
safe_zones:
  "9:16": {top: 0.14, bottom: 0.20, left: 0.06, right: 0.06}
  "16:9": {top: 0.07, bottom: 0.12, left: 0.06, right: 0.06}
  "1:1": {top: 0.08, bottom: 0.14, left: 0.07, right: 0.07}
